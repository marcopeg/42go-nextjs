services:
  app:
    image: 42go-next:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file:
      - .env
    volumes:
      - ./contents:/app/contents
      - quickshare_publications:/app/.quickshare-public
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      # - APP_ID=default
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      quickshare-publication-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  quickshare-static:
    build:
      context: ./infra/quickshare-nginx
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    volumes:
      - quickshare_publications:/srv/quickshare-public:ro
    ports:
      - '8088:8080'
    depends_on:
      quickshare-publication-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8080/does-not-exist || test $$? -eq 8']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  quickshare-publication-init:
    image: alpine:3.21
    volumes:
      - quickshare_publications:/publication
    command: ['sh', '-c', 'mkdir -p /publication && chown -R 1001:1001 /publication && chmod 0755 /publication']
    restart: 'no'
    networks:
      - app-network

volumes:
  pgdata:
    driver: local
  quickshare_publications:
    driver: local

networks:
  app-network:
    driver: bridge
