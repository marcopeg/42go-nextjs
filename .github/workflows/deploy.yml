name: Deploy 42go Next.js

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: marcopeg/42go-next

jobs:
  build-and-deploy:
    name: Build, publish, and deploy ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Validate the semantic release tag matches package.json
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the AMD64 production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_ENV=production
            APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Deploy the immutable image with CapRover
        env:
          CAPROVER_URL: ${{ secrets.CAPROVER_URL }}
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          CAPROVER_IMAGE: ${{ env.IMAGE }}:${{ github.ref_name }}
        run: |
          npx --yes caprover deploy \
            --caproverUrl "$CAPROVER_URL" \
            --caproverApp "$CAPROVER_APP" \
            --imageName "$CAPROVER_IMAGE" \
            --appToken "$CAPROVER_APP_TOKEN"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --title "42go Next.js $VERSION" --generate-notes
