server {
  listen 8080 default_server;
  server_name _;
  return 444;
}

server {
  listen 8080;
  server_name s.42go.dev;
  root /srv/quickshare-public;
  autoindex off;
  server_tokens off;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

  # The only public immutable namespace. Compiler output is always verified
  # before it reaches this path; hidden control directories remain private.
  location ~ "^/_quickshare/releases/(?<qs_app>[a-z0-9_-]+)/(?<qs_resource>[a-z0-9_-]+)/(?<qs_release>[a-z0-9_-]+)/[A-Za-z0-9._/-]+$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # A release asset may never register a worker for a stable share route or
    # another release. The shared execution origin therefore has no broad
    # service-worker authority.
    add_header Service-Worker-Allowed "/_quickshare/releases/$qs_app/$qs_resource/$qs_release/" always;
  }

  location ~ "^/(\\.[^/]+|_quickshare/(?!releases/))" { return 404; }

  # A share is exactly one route segment, or an owner handle plus one custom
  # identifier. No generic prefix fallback exists and nothing proxies Next.js.
  location ~ "^/([a-z0-9][a-z0-9_-]{5,31})/?$" {
    try_files /$1/index.html =404;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  location ~ "^/([a-z0-9][a-z0-9-]{2,39})/([a-z0-9][a-z0-9-]{0,79})/?$" {
    try_files /$1/$2/index.html =404;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  location / { return 404; }
}
